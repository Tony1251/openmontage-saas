name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────── API (Python / FastAPI) ───────────────────────────
  api-lint-and-test:
    name: API · lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: om
          POSTGRES_PASSWORD: om_test
          POSTGRES_DB: om_saas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U om -d om_saas_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://om:om_test@localhost:5432/om_saas_test
      MCP_URL: http://localhost:8765/mcp
      MCP_TOKEN: test-token
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      STRIPE_PRICE_PRO: price_pro_dummy
      STRIPE_PRICE_ENTERPRISE: price_enterprise_dummy
      API_BASE_URL: http://localhost:8000
      WEB_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/api/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Apply migrations
        run: |
          PGPASSWORD=om_test psql -h localhost -U om -d om_saas_test -c "SELECT 1"
          uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -v --tb=short

  # ─────────────────────────── Web (TypeScript / Next.js) ───────────────────────────
  web-typecheck-and-lint:
    name: Web · typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      CLERK_SECRET_KEY: sk_test_dummy
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_dummy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx next lint

      - name: Build (sanity check)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ─────────────────────────── Docker Compose validate ───────────────────────────
  compose-validate:
    name: docker compose · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
