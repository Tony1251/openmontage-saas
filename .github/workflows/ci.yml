name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────── API (Python / FastAPI) ───────────────────────────
  api-lint-and-test:
    name: API · lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      # Tests run on in-memory SQLite with MOCK_MODE — no Postgres / no Ark key
      # needed (env is injected by pytest-env via pyproject `[tool.pytest.ini_options]`).
      - name: Pytest
        run: uv run pytest -q

  # ─────────────────────── API · tests on real Postgres 16 ───────────────────────
  # Runs the credit-ledger module (incl. §7 concurrent-debit) against a real
  # Postgres so oversell-safety is proven under genuine row-lock semantics —
  # SQLite's single shared :memory: connection serialises concurrent txns and
  # cannot exercise the row-lock race. `tests/conftest.py` reads TEST_DATABASE_URL
  # to swap the fixture off SQLite.
  #
  # TODO(devops): widen to `pytest -q` (full suite) once @backend aligns the ORM
  # datetime columns with the migrations (models use naive `DateTime`, migrations
  # use `DateTime(timezone=True)`); today `test_video_provider.py`'s two
  # submit→poll tests write `datetime.now(UTC)` into a naive column and fail on
  # Postgres. Everything else already passes on Postgres 16.
  api-test-postgres:
    name: API · test on Postgres 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: om
          POSTGRES_PASSWORD: om
          POSTGRES_DB: om_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U om -d om_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://om:om@localhost:5432/om_test
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Pytest (credit ledger + concurrency on Postgres)
        run: uv run pytest tests/test_credits.py -q

  # ─────────────────────────── Web (TypeScript / Next.js) ───────────────────────────
  web-typecheck-lint-build:
    name: Web · typecheck + lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Format-valid fake publishable key (decodes to "clerk.example.com$"); Clerk rejects
      # bare "pk_test_dummy" at build. Swap for a GitHub secret for real deploy.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      # SECURITY: a real Clerk secret key was previously committed here in plaintext
      # (now in git history — must be ROTATED). Replace this placeholder with
      # ${{ secrets.CLERK_SECRET_KEY }} and add the real key as a GitHub secret only.
      CLERK_SECRET_KEY: sk_test_dummy
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        # --legacy-peer-deps: @clerk/nextjs@6.39.6 peers on next ^15.2.3, but we pin next 15.0.3.
        # Proper fix: bump next to 15.2.x (also fixes CVE-2025-66478) — see TODO below.
        run: npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Build (sanity check)
        run: npm run build

  # ─────────────────────────── Docker Compose validate ───────────────────────────
  compose-validate:
    name: docker compose · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
