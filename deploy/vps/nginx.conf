# OpenMontage SaaS — nginx reverse proxy template (Ubuntu/Debian).
# Drop into /etc/nginx/sites-available/openmontage, symlink into
# /etc/nginx/sites-enabled, then:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d your-domain.com -d api.your-domain.com

# --- Main site → Next.js (web container on 127.0.0.1:3000) ---
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API → FastAPI (api container on 127.0.0.1:8000) ---
server {
    listen 80;
    listen [::]:80;
    server_name api.your-domain.com;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# NOTE: run `certbot --nginx` once and it will rewrite these blocks to add
# `listen 443 ssl` + certificate directives and a 301 from :80 → :443.
